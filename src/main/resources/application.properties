spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_NAME:todo_application}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:MySQL$123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.format_sql=true
#spring.jpa.dagabase-platform=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto = update

#Hibernate5 SessionContext
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

server.port=8181


spring.mvc.view.prefix = /
spring.mvc.view.suffix = .html