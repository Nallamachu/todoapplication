<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <title>Home page</title>
</head>
<body>
<div th:replace="header"></div>
<div class="col-md-offset-2 col-sm-8">
    Hello, <a th:href="@{|/users/${#authentication.principal.id}/read|}"><span
        sec:authentication="principal.firstName">Name</span></a>, <br/><br/>
    Welcome to Todo Application.<br/><br/>
    Todo Application will facilitate to manage Todo lists and Todo related tasks information. You can perform Create/Update/Delete operations on Todo list.<br/><br/>
    <a th:href="@{|/todos/all/users/${#authentication.principal.id}|}">Go My ToDo List</a>
</div>
</body>
</html>
